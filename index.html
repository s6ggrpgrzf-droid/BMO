<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2b33">
<meta name="description" content="BMO — an interactive video player that plays BMO stuff only.">
<title>BMO · Interactive Video Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <noscript><p class="noscript">BMO needs JavaScript to play tapes.</p></noscript>

  <!-- ambient scene layers -->
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
  </div>
  <canvas id="fireflies" aria-hidden="true"></canvas>
  <div class="hills" aria-hidden="true"></div>

  <main class="stage">
    <header class="marquee">
      <h1><span class="logo-bmo">BMO</span> <span class="logo-sub">VIDEO PLAYER</span></h1>
      <p class="tagline">BMO plays BMO stuff only</p>
    </header>

    <!-- BMO the console -->
    <div class="bmo-wrap">
      <div class="speech" id="speech" role="status" aria-live="polite">
        <span id="speechText">Pick a tape!</span>
      </div>

      <div class="bmo" id="bmo">
        <div class="screen-bezel">
          <div class="screen" id="screen">
            <div id="ytmount"></div>
            <canvas id="static" aria-hidden="true"></canvas>
            <div class="scanlines" aria-hidden="true"></div>
            <div class="vignette" aria-hidden="true"></div>
            <div class="face" id="face" aria-hidden="true">
              <div class="eye left"><span class="pupil"></span></div>
              <div class="eye right"><span class="pupil"></span></div>
              <div class="mouth"></div>
              <p class="face-prompt">tap a tape below</p>
            </div>
            <div class="nowplaying" id="nowPlaying" aria-hidden="true"><span></span></div>
          </div>
        </div>

        <div class="deck">
          <div class="btn-row">
            <button class="cbtn" id="btnPrev" aria-label="Previous tape" title="Previous tape">⏮</button>
            <button class="cbtn big" id="btnPlay" aria-label="Play or pause" title="Play / pause">▶</button>
            <button class="cbtn" id="btnNext" aria-label="Next tape" title="Next tape">⏭</button>
            <button class="cbtn" id="btnShuffle" aria-label="Shuffle tapes" title="Shuffle">🔀</button>
          </div>
          <div class="btn-row small">
            <button class="cbtn mini" id="btnMusic" aria-label="Toggle music" title="Music on/off" aria-pressed="false">🎵</button>
            <button class="cbtn mini" id="btnFull" aria-label="Fullscreen" title="Fullscreen">⛶</button>
            <button class="cbtn mini" id="btnQuote" aria-label="BMO says something" title="BMO says…">💬</button>
          </div>
          <div class="grille" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>

        <div class="legs" aria-hidden="true"><span></span><span></span></div>
        <div class="side-label" aria-hidden="true">BMO</div>
      </div>
    </div>

    <!-- tape shelf -->
    <section class="shelf-section">
      <h2>📼 Tape shelf</h2>
      <div class="shelf" id="shelf"></div>
      <p class="shelf-hint">Tip: press <kbd>B</kbd><kbd>M</kbd><kbd>O</kbd> for a surprise.</p>
    </section>

    <footer class="credits">
      <p>Clips courtesy of Cartoon Network's official YouTube channel · fan-made player, not affiliated with Cartoon Network</p>
    </footer>
  </main>

  <div class="confetti-layer" id="confetti" aria-hidden="true"></div>

  <script src="audio.js"></script>
  <script src="player.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
